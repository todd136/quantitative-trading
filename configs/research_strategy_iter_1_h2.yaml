# Research iter-1 H2: modest momentum/value weight tilt on top of H1 weekly baseline.
# Diff vs configs/research_strategy_iter_1.yaml (H1): factors.value.weight 1.0→0.8, factors.momentum.weight 1.0→1.2.
# quality stays 1.0; weekly rebalance + paper_export unchanged. Formal defaults / example.yaml untouched.
# A/B vs H1 on same calendar; quote metrics from artifacts only. Not investment advice.
version: "v1.2-20260928"
market:
  boards: ["SSE_MAIN", "SZSE_MAIN", "CHINEXT", "STAR"]   # 含科创板；不含 BSE（北交所）
  exclude_st: true
  require_star_eligibility: false
universe:
  min_list_trading_days: 60
  min_adv_20: 20000000
  min_adv_valid_days: 15
factors:
  quality:  {enabled: true, weight: 1.0}
  value:    {enabled: true, weight: 0.8}  # H2 tilt down vs H1
  momentum: {enabled: true, weight: 1.2}  # H2 tilt up vs H1
  require_all: true   # formal — all enabled factors must be present
processing:
  winsorize: {method: "MAD", n: 5}
  industry_neutral: true   # formal — requires non-empty SW_L1 membership
  industry_source: "SW_L1"
  zscore: true
portfolio:
  N: 50
  weight: "equal"
  industry_cap_ratio: 0.15
  rebalance_freq: "weekly"   # H1 research baseline (formal short still uses daily)
  rebalance_weekday: 2       # 0=Mon .. 6=Sun
signal:
  signal_price: "close"
  exec_price: "open"
costs:
  commission_bps: 3
  stamp_tax_bps: 5
  slippage_bps: 5
execution:
  rolling_unfilled: false
  volume_constraint_enabled: false
  buy_limit_handler: "skip"
  lot_size: 100
backtest:
  benchmark: "000300.SH"
  risk_free: 0.0
  initial_cash: 100000000
  float_tol:
    rel: 1.0e-9
    abs: 1.0e-12
  # Same short calendar as configs/akshare_short_formal.yaml for A/B.
  start_date: "2024-01-02"
  end_date: "2024-01-31"
  sample_split:
    train_end: "2024-01-10"
    val_end: "2024-01-19"
    # OOS = (val_end, end_date]
data:
  provider: "akshare"
  fixture_dir: "testdata/fixtures"
  akshare_python: ".venv/bin/python"
  akshare_helper: "scripts/akshare_fetch.py"
  akshare_cache_dir: "testdata/akshare_cache"
  max_symbols: 60
llm:
  enabled: false
  weight: 0.0
  score_pipeline: "zscore_only"
  attach_point: "post_universe"
  apply_to_holdings: false
  filter:
    enabled: false
    min_confidence: 0.5
    block_tags: []
  model:
    model_id: ""
    prompt_version: "llm_prompt_v1"
    temperature: 0.0
    seed: 0
    timeout_ms: 8000
    max_retries: 0
  cache:
    enabled: true
    key_fields: ["model_id", "prompt_version", "signal_date", "ts_code", "source_ids_hash"]
  text:
    timezone: "Asia/Shanghai"
    require_asof_leq_signal: true
    on_missing: "degrade_to_three_factor"
  audit:
    log_raw_text: false
    log_prompt_full: false
    log_structured_summary: true
    compliance_notice: "non_investment_advice"
paper_export:
  enabled: true   # next-day targets only; cadence follows weekly rebalance
