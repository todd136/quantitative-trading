# SMOKE ONLY — do not use as production defaults.
# Purpose: get non-empty fills from real AKShare market data with momentum-only
# scoring when quality/value fundamentals are incomplete.
# Diffs vs configs/akshare_short.yaml:
#   - processing.industry_neutral: false  (missing EM industry must not wipe scores)
#   - factors.require_all: false          (momentum can score alone)
# Keep akshare provider, short window, max_symbols, .venv python, llm=false.
version: "v1.2-20260928"
market:
  boards: ["SSE_MAIN", "SZSE_MAIN", "CHINEXT", "STAR"]   # 含科创板；不含 BSE（北交所）
  exclude_st: true
  require_star_eligibility: false
universe:
  min_list_trading_days: 60
  min_adv_20: 20000000
  min_adv_valid_days: 15
factors:
  # SMOKE ONLY: keep all three enabled; require_all=false degrades to whatever
  # raw factors are available (typically momentum). Disable quality/value only
  # if scoring is still empty after require_all=false.
  quality:  {enabled: true, weight: 1.0}
  value:    {enabled: true, weight: 1.0}
  momentum: {enabled: true, weight: 1.0}
  require_all: false   # SMOKE ONLY — production uses true
processing:
  winsorize: {method: "MAD", n: 5}
  industry_neutral: false   # SMOKE ONLY — production uses true; industry fetch often empty
  industry_source: "EM_INDUSTRY"  # AKShare helper emits EM_INDUSTRY (not SW_L1)
  zscore: true
portfolio:
  N: 50
  weight: "equal"
  industry_cap_ratio: 0.15
  rebalance_freq: "daily"
  rebalance_weekday: 2
signal:
  signal_price: "close"
  exec_price: "open"
costs:
  commission_bps: 3
  stamp_tax_bps: 5
  slippage_bps: 5
execution:
  rolling_unfilled: true
  volume_constraint_enabled: false
  buy_limit_handler: "renormalize"
  lot_size: 100
backtest:
  benchmark: "000300.SH"
  risk_free: 0.0
  initial_cash: 100000000
  float_tol:
    rel: 1.0e-9
    abs: 1.0e-12
  # Fixture calendar spans ~2023-01 → 2025-03; demo split uses short recent window.
  # For live/multi-year runs set e.g. start 2018-01-01 / train_end 2020-12-31 / val_end 2022-12-31 / end 2024-12-31.
  start_date: "2024-01-02"
  end_date: "2024-01-31"
  sample_split:
    train_end: "2024-01-10"
    val_end: "2024-01-19"
    # OOS = (val_end, end_date]
  # walk_forward:            # optional skeleton (not fully executed yet)
  #   train_years: 3
  #   test_years: 1
data:
  provider: "akshare"          # fixture | akshare
  fixture_dir: "testdata/fixtures"
  akshare_python: ".venv/bin/python"
  akshare_helper: "scripts/akshare_fetch.py"
  akshare_cache_dir: "testdata/akshare_cache"
  # DEBUG ONLY smoke sampling: full-universe windowed fetch still ~hours at ~3-5s/symbol.
  # Production path must rely on date-window truncation (not permanent sampling).
  max_symbols: 40
llm:
  enabled: false
  weight: 0.0
  score_pipeline: "zscore_only"
  attach_point: "post_universe"
  apply_to_holdings: false
  filter:
    enabled: false
    min_confidence: 0.5
    block_tags: []
  model:
    model_id: ""
    prompt_version: "llm_prompt_v1"
    temperature: 0.0
    seed: 0
    timeout_ms: 8000
    max_retries: 0
  cache:
    enabled: true
    key_fields: ["model_id", "prompt_version", "signal_date", "ts_code", "source_ids_hash"]
  text:
    timezone: "Asia/Shanghai"
    require_asof_leq_signal: true
    on_missing: "degrade_to_three_factor"
  audit:
    log_raw_text: false
    log_prompt_full: false
    log_structured_summary: true
    compliance_notice: "non_investment_advice"
