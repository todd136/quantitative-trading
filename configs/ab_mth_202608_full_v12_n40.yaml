# Monthly OOS AB: 2026-08 / full / v12_n40
# 全量池 same as ab_roll / ab_main_formal; industry_neutral=true; industry_cap_ratio=0.15
# Arm: value=1.2 N=40
# Expected OOS: ~2026-08-03..2026-08-31
# Untracked research config; KEEP_DEFAULT unchanged; do not push.
version: "v1.2-20260928"
market:
  boards: ["SSE_MAIN", "SZSE_MAIN", "CHINEXT", "STAR"]
  exclude_st: true
  require_star_eligibility: false
universe:
  min_list_trading_days: 60
  min_adv_20: 20000000
  min_adv_valid_days: 15
factors:
  quality:  {enabled: true, weight: 1.0}
  value:    {enabled: true, weight: 1.2}
  momentum: {enabled: true, weight: 1.0}
  require_all: true
processing:
  winsorize: {method: "MAD", n: 5}
  industry_neutral: true
  industry_source: "SW_L1"
  zscore: true
portfolio:
  N: 40
  weight: "equal"
  industry_cap_ratio: 0.15
  rebalance_freq: "weekly"
  rebalance_weekday: 2
signal:
  signal_price: "close"
  exec_price: "open"
costs:
  commission_bps: 3
  stamp_tax_bps: 5
  slippage_bps: 5
execution:
  rolling_unfilled: true
  volume_constraint_enabled: false
  buy_limit_handler: "renormalize"
  lot_size: 100
backtest:
  benchmark: "000300.SH"
  risk_free: 0.0
  initial_cash: 100000000
  float_tol:
    rel: 1.0e-9
    abs: 1.0e-12
  start_date: "2025-01-01"
  end_date: "2026-08-31"
  sample_split:
    train_end: "2026-01-31"
    val_end: "2026-07-31"
data:
  provider: "akshare"
  fixture_dir: "testdata/fixtures"
  akshare_python: ".venv/bin/python"
  akshare_helper: "scripts/akshare_fetch.py"
  akshare_cache_dir: "testdata/akshare_cache"
  max_symbols: 0
llm:
  enabled: false
  weight: 0.0
  score_pipeline: "zscore_only"
  attach_point: "post_universe"
  apply_to_holdings: false
  filter:
    enabled: false
    min_confidence: 0.5
    block_tags: []
  model:
    model_id: ""
    prompt_version: "llm_prompt_v1"
    temperature: 0.0
    seed: 0
    timeout_ms: 8000
    max_retries: 0
  cache:
    enabled: true
    key_fields: ["model_id", "prompt_version", "signal_date", "ts_code", "source_ids_hash"]
